name: Auto-deploy to Vercel

# Workaround para a Vercel GitHub App não estar instalada no repo (auto-deploy quebrado).
# Em vez de depender da integração nativa, este workflow dispara um Deploy Hook do Vercel
# (https://vercel.com/docs/deployments/deploy-hooks) a cada push pra main.
#
# A URL do hook só dispara deploys do código já no repo — ela não expõe credenciais nem
# permite leitura/modificação do projeto, então é seguro mantê-la no workflow público.
#
# QUANDO REMOVER: Quando a Vercel GitHub App for reinstalada (https://github.com/apps/vercel),
# o auto-deploy nativo volta a funcionar e este workflow vira redundante.

on:
  push:
    branches: [main]
  # Permite trigger manual pela UI do GitHub
  workflow_dispatch:

jobs:
  trigger:
    name: Disparar Deploy Hook do Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chama Deploy Hook
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.vercel.com/v1/integrations/deploy/prj_Wo2Oroi6QJzJo0lvUmgL2NVTCLto/kOfiy1GZVs")
          status=$(echo "$response" | grep -oP '(?<=HTTP_STATUS:)\d+')
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          echo "Status: $status"
          echo "Response: $body"
          if [ "$status" != "201" ] && [ "$status" != "200" ]; then
            echo "::error::Deploy hook falhou (status $status)"
            exit 1
          fi
          echo "::notice::Deploy disparado com sucesso. Acompanhe em https://vercel.com/avont-sistemas-projects/mediclin"
