  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

x: 55; pointer-events: none;\n  color: var(--sb, #0c1413);\n  font-size: 14px; font-weight: 700; letter-spacing: -0.01em;\n}\n.statusbar.light { --sb: #ffffff; }\n.statusbar .sb-right { display: flex; align-items: center; gap: 7px; }\n.statusbar .sb-right svg { display: block; }\n\n/* ---- Screen base --------------------------------------------- */\n.screen {\n  position: absolute; inset: 0;\n  background: #fff;\n  display: flex; flex-direction: column;\n  will-change: transform, opacity;\n  transform: translateX(100%);\n  opacity: 0;\n  z-index: 1;\n}\n.screen.active { transform: none; opacity: 1; z-index: 2; }\n.screen .scroll {\n  flex: 1; overflow: hidden; position: relative;\n}\n.screen .scroll-inner {\n  will-change: transform;\n}\n\n/* tap feedback */\n.pressable { transition: transform .14s ease, filter .14s ease; }\n.pressable.pressed { transform: scale(.965); filter: brightness(.97); }\n\n/* ============================================================\n   TOUCH indicator\n   ============================================================ */\n#touch {\n  position: absolute; top: 0; left: 0;\n  width: 46px; height: 46px; margin: -23px 0 0 -23px;\n  z-index: 80; pointer-events: none;\n  opacity: 0;\n  transform: translate(180px, 420px);\n  transition: opacity .35s ease;\n}\n#touch .tip {\n  position: absolute; inset: 0;\n  border-radius: 999px;\n  background: radial-gradient(circle at 38% 34%, rgba(0,108,93,.42), rgba(0,55,60,.34) 70%);\n  border: 1.5px solid rgba(255,255,255,.55);\n  box-shadow: 0 4px 14px rgba(0,55,60,.30);\n  transform: scale(1);\n  transition: transform .16s cubic-bezier(.22,1,.36,1);\n}\n#touch.down .tip { transform: scale(.74); }\n#touch .ring {\n  position: absolute; inset: 0; border-radius: 999px;\n  border: 2px solid var(--brand);\n  opacity: 0; transform: scale(.5);\n}\n#touch.down .ring { animation: ripple .55s ease-out; }\n@keyframes ripple {\n  0%   { opacity: .55; transform: scale(.5); }\n  100% { opacity: 0;   transform: scale(2.  gap: 5px; }\n.ig .ig-hl .c { width: 62px; height: 62px; border-radius: 999px; border: 1px solid #dbdbdb; display: grid; place-items: center; color: var(--brand); background: var(--brand-soft); }\n.ig .ig-hl .t { font-size: 11px; color: #1a1a1a; }\n.ig .ig-tabs { display: flex; border-top: 1px solid #dbdbdb; }\n.ig .ig-tabs .t { flex: 1; height: 44px; display: grid; place-items: center; color: #8a8a8f; }\n.ig .ig-tabs .t.on { color: #0c1413; border-top: 1.5px solid #0c1413; margin-top: -1px; }\n.ig .ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }\n.ig .ig-grid .cell { aspect-ratio: 1; background: var(--brand-soft); position: relative; overflow: hidden; }\n.ig .ig-grid .cell::after { content: \"\"; position: absolute; inset: 0; background: linear-gradient(135deg, oklch(0.93 0.04 176), oklch(0.88 0.05 200)); }\n.ig .ig-grid .cell:nth-child(3n+2)::after { background: linear-gradient(135deg, oklch(0.90 0.05 176), oklch(0.83 0.06 188)); }\n.ig .ig-grid .cell:nth-child(3n)::after { background: linear-gradient(160deg, oklch(0.95 0.03 176), oklch(0.86 0.05 200)); }\n\n/* ============================================================\n   SCREEN 2 — Public profile (in-app browser)\n   ============================================================ */\n.browser-bar {\n  padding: 46px 14px 10px;\n  background: #f6f6f7; border-bottom: 1px solid var(--border);\n  display: flex; align-items: center; gap: 9px;\n}\n.browser-bar .url {\n  flex: 1; height: 34px; border-radius: 9px; background: #fff;\n  border: 1px solid var(--border); display: flex; align-items: center; gap: 7px;\n  padding: 0 12px; font-size: 13px; color: var(--fg-2); font-weight: 500;\n}\n.browser-bar .url svg { color: var(--brand); }\n.browser-bar .url .host { color: var(--fg-1); font-weight: 700; }\n.browser-bar .ic { width: 30px; height: 30px; display: grid; place-items: center; color: var(--fg-muted); }\n\n.prof-head { position: relative; }\n.prof-banner { position: absolute; inset: 0 0 auto 0; height: 142px; background: var(--grad-header); }\n.prof-head-in { position: relative; padding: 26px 20px 16px; }\n.prof-top { display: flex; align-items: flex-end; gap: 15px; }\n.prof-photo { width: 84px; height: 84px; border-radius: 20px; object-fit: cover; box-shadow: 0 0 0 4px #fff, 0 10px 24px -8px rgba(0,55,60,.4); }\n.prof-id { color: #fff; padding-bottom: 4px; }\n.prof-id h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }\n.prof-id .spec { font-size: 12.5px; color: rgba(255,255,255,.88); margin-top: 3px; }\n.prof-meta { margin-top: 13px; display: flex; align-items: center; gap: 11px; color: rgba(255,255,255,.9); font-size: 12px; }\n.prof-meta .i { display: inline-flex; align-items: center; gap: 4px; }\n.prof-meta .i svg { color: #ffd84d; }\n.prof-meta .sep { opacity: .4; }\n.prof-body { padding: 16px 20px 30px; }\n.prof-bio { font-size: 13.5px; line-height: 1.55; color: var(--fg-2); }\n.prof-h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin: 22px 0 12px; }\n.svc-list { display: flex; flex-direction: column; gap: 9px; }\n.svc {\n  width: 100%; text-align: left; background: #fff; border: 1px solid var(--border);\n  border-radius: 18px; padding: 16px; display: flex; align-items: flex-start; gap: 13px;\n  box-shadow: 0 1px 2px rgba(0,55,60,.04);\n}\n.svc.sel { border-color: var(--brand); box-shadow: 0 10px 26px -12px rgba(0,108,93,.4); }\n.svc .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; }\n.svc .mid { flex: 1; min-width: 0; }\n.svc .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.svc .nm { font-size: 14.5px; font-weight: 700; color: var(--fg-1); }\n.svc .pr { font-size: 14.5px; font-weight: 700; color: var(--brand); }\n.svc .desc { font-size: 12px; color: var(--fg-muted); margin-top: 3px; line-height: 1.4; }\n.svc .chev { color: var(--fg-subtle); margin-top: 6px; }\n.wa-card {\n  margin-top: 22px; border: 1px solid var(--border); background: #fff; border-radius: 18px;\n  padding: 15px; display: flex; align-items: center; gap: 11px; font-size: 12.5px; color: var(--fg-2);\n}\n.wa-card svg { color: #20b35b; flex: none; }\n.wa-card b { color: var(--fg-1); }\n\n/* ============================================================\n   SCREENS 3-5 — Booking wizard\n   ============================================================ */\n.wz-head {\n  padding: 46px 18px 14px; background: #fff; border-bottom: 1px solid var(--border);\n  display: flex; align-items: center; gap: 12px;\n}\n.wz-head .back { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--fg-2); }\n.wz-head .ttl { font-size: 14.5px; font-weight: 700; }\n.wz-head .sub { font-size: 11.5px; color: var(--fg-muted); margin-top: 1px; }\n.wz-body { padding: 20px 18px 28px; }\n\n.steps { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }\n.steps .st { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }\n.steps .bub { width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; background: var(--slate-100); color: var(--fg-subtle); flex-shrink: 0; }\n.steps .st.done .bub, .steps .st.cur .bub { background: var(--brand); color: #fff; }\n.steps .lbl { font-size: 11.5px; font-weight: 600; color: var(--fg-subtle); white-space: nowrap; flex-shrink: 0; }\n.steps .st.cur .lbl { color: var(--fg-1); }\n.steps .line { flex: 1 1 0; min-width: 8px; height: 1px; background: var(--slate-200); }\n.steps .line.done { background: var(--brand); }\n\n.svc-summary { border-radius: 14px; background: var(--brand-soft); border: 1px solid oklch(0.85 0.055 176); padding: 14px; display: flex; gap: 12px; margin-bottom: 20px; }\n.svc-summary .ic { width: 40px; height: 40px; border-radius: 11px; background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; }\n.svc-summary .nm { font-size: 14px; font-weight: 700; }\n.svc-summary .mt { font-size: 12px; color: var(--fg-2); margin-top: 2px; }\n\n.wz-h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; }\n\n/* calendar */\n.cal { border: 1px solid var(--border); border-radius: 14px; padding: 15px; }\n.cal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }\n.cal-top .mo { font-size: 13px; font-weight: 700; text-transform: capitalize; }\n.cal-top .nav { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--fg-muted); }\n.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }\n.cal-grid .wd { text-align: center; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--fg-subtle); padding: 4px 0; }\n.cal-grid .d { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: var(--fg-2); }\n.cal-grid .d.off { color: var(--slate-200); }\n.cal-grid .d.today { box-shadow: inset 0 0 0 1px var(--mint); }\n.cal-grid .d.sel { background: var(--brand); color: #fff; }\n\n/* time slots */\n.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }\n.slot { padding: 11px 0; text-align: center; border-radius: 11px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--fg-2); }\n.slot.sel { background: var(--brand); border-color: var(--brand); color: #fff; }\n.daylink { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--fg-muted); margin-bottom: 14px; }\n\n/* form */\n.field { margin-bottom: 15px; }\n.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--fg-2); margin-bottom: 6px; }\n.field .input {\n  width: 100%; height: 42px; border-radius: 11px; border: 1px solid var(--border); background: #fff;\n  padding: 0 13px; font-size: 14px; color: var(--fg-1); display: flex; align-items: center; font-family: var(--font);\n}\n.field .input.focus { border-color: var(--brand-bright); box-shadow: 0 0 0 3px oklch(0.66 0.09 176 / .18); }\n.field .input .ph { color: var(--fg-subtle); }\n.field .input .caret { width: 1.5px; height: 18px; background: var(--brand); margin-left: 1px; animation: blink 1s steps(1) infinite; }\n@keyframes blink { 50% { opacity: 0; } }\n.summary { margin-top: 6px; border-radius: 14px; background: var(--slate-50); border: 1px solid var(--border); padding: 15px; font-size: 13px; color: var(--fg-2); }\n.summary .hd { font-weight: 700; color: var(--fg-1); margin-bottom: 4px; }\n.summary .tot { font-weight: 700; color: var(--fg-1); margin-top: 3px; }\n.redirect-note { margin-top: 12px; display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--fg-muted); }\n\n/* primary button */\n.btn-primary {\n  width: 100%; height: 46px; border-radius: 12px; background: var(--brand); color: #fff;\n  font-size: 14.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;\n  margin-top: 20px; font-family: var(--font); border: none;\n}\n.btn-primary.dim { opacity: .45; }\n\n/* ============================================================\n   SCREEN 6 — Payment (Mercado Pago · Pix)\n   ============================================================ */\n.mp { background: #fff; display: flex; flex-direction: column; height: 100%; }\n.mp-top {\n  padding: 46px 18px 16px; background: #009ee3; color: #fff;\n  display: flex; align-items: center; gap: 11px;\n}\n.mp-top .mp-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }\n.mp-top .mp-logo .mark { width: 30px; height: 22px; border-radius: 6px; background: #fff; display: grid; place-items: center; }\n.mp-top .lock { margin-left: auto; opacity: .9; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; }\n.mp-body { padding: 20px 20px 24px; flex: 1; overflow: hidden; }\n.mp-amount { text-align:
